name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 构建与自检 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建与数学自检
        run: npm run verify

      - name: 检查产物
        run: |
          for file in dist/uni-skybox.esm.js dist/uni-skybox.umd.js dist/types/index.d.ts; do
            test -f "$file" || { echo "缺少产物: $file"; exit 1; }
          done
          echo "产物齐全"